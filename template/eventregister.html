<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
.event-table {
    width: 100%;
    border-collapse: collapse;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 30px;
    box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
}

.event-table thead {
    background-color: #4CAF50;
    color: #fff;
    font-size: 16px;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 15px 20px;
}

.event-table th {
    padding: 15px 20px;
}

.event-table tbody {
    background-color: #ffffff;
}

.event-table td {
    padding: 12px 20px;
    text-align: left;
    font-size: 14px;
    color: #333;
    border-bottom: 2px solid #f1f1f1;
}

.event-table tbody tr:hover {
    background-color: #f9f9f9;
    transform: scale(1.01);
    transition: all 0.3s ease-in-out;
}

.event-table td img {
    max-width: 80px;
    height: auto;
    border-radius: 5px;
    object-fit: cover;
}

.event-table td:first-child {
    font-weight: bold;
    color: #333;
}

@media screen and (max-width: 768px) {
    .event-table th,
    .event-table td {
        padding: 10px 15px;
        font-size: 12px;
    }

    .event-table td img {
        max-width: 60px;
    }
}

.event-table tbody tr.empty {
    text-align: center;
    color: #aaa;
    font-style: italic;
}

.event-table th:hover {
    background-color: #45a049;
    cursor: pointer;
}

</style>
<body>

<table class="event-table">
  <thead>
    <tr>
      <th><b>Event Id</b></th>
      <th><b>Event Name</b></th>
      <th><b>Event Type</b></th>
      <th><b>Event Description</b></th>
      <th><b>Event Capacity</b></th>
      <th><b>Event Location</b></th>
      <th><b>Event Price</b></th>
      <th><b>Event Image</b></th>
    </tr>
  </thead>
  <tbody>
    {% for i in data %}
    <tr>
      <td>{{ i.0 }}</td> <!-- Event Id -->
      <td>{{ i.1 }}</td> <!-- Event Name -->
      <td>{{ i.2 }}</td> <!-- Event Type -->
      <td>{{ i.3 }}</td> <!-- Event Description -->
      <td>{{ i.4 }}</td> <!-- Event Capacity -->
      <td>{{ i.5 }}</td> <!-- Event Location -->
      <td>{{ i.6 }}</td> <!-- Event Price -->
      <td><img src="{% static 'images/' %}{{ i.7 }}" alt="Event Image" /></td> <!-- Event Image -->
    </tr>
    {% endfor %}
  </tbody>
</table>
