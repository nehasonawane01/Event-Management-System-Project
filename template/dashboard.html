<style type="text/css">
      /* Google Font Import - Poppins */
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

:root {
  /* ===== Colors ===== */
  --body-color: #E4E9F7;
  --sidebar-color: #fff;
  --primary-color: #695cfe;
  --primary-color-light: #f6f5ff;
  --toggle-color: #ddd;
  --text-color: #707070;

  /* ====== Transition ====== */
  --tran-03: all 0.2s ease;
  --tran-03: all 0.3s ease;
  --tran-04: all 0.3s ease;
  --tran-05: all 0.3s ease;
}

body {
  min-height: 100vh;
  background-color: #FFB347;
  transition: var(--tran-05);
}

::selection {
  background-color: var(--primary-color);
  color: #fff;
}

body.dark {
  --body-color: #FFB347;
  --sidebar-color: #242526;
  --primary-color: #3a3b3c;
  --primary-color-light: #3a3b3c;
  --toggle-color: #fff;
  --text-color: #ccc;
}

/* ===== Sidebar ===== */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 250px;
  padding: 10px 14px;
  background: var(--sidebar-color);
  transition: var(--tran-05);
  z-index: 100;
}
.sidebar.close {
  width: 88px;
}

/* ===== Reusable code - Here ===== */
.sidebar li {
  height: 50px;
  list-style: none;
  display: flex;
  align-items: center;
  margin-top: 10px;

}

.sidebar header .image,
.sidebar .icon {
  min-width: 60px;
  border-radius: 6px;
}

.sidebar .icon {
  min-width: 60px;
  border-radius: 6px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  padding-right: 35px;
}

.sidebar .text,
.sidebar .icon {
  color: var(--text-color);
  transition: var(--tran-03);
}

.sidebar .text {
  font-size: 17px;
  font-weight: 500;
  white-space: nowrap;
  opacity: 1;
}
.sidebar.close .text {
  opacity: 0;
}
/* =========================== */

.sidebar header {
  position: relative;
}

.sidebar header .image-text {
  display: flex;
  align-items: center;
}
.sidebar header .logo-text {
  display: flex;
  flex-direction: column;
}
header .image-text .name {
  margin-top: 2px;
  font-size: 18px;
  font-weight: 600;
}

header .image-text .profession {
  font-size: 16px;
  margin-top: -2px;
  display: block;
}

.sidebar header .image {
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar header .image img {
  width: 40px;
  border-radius: 6px;
}

.sidebar header .toggle {
  position: absolute;
  top: 50%;
  right: -25px;
  transform: translateY(-50%) rotate(180deg);
  height: 25px;
  width: 25px;
  background-color: var(--primary-color);
  color: var(--sidebar-color);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  transition: var(--tran-05);
}

body.dark .sidebar header .toggle {
  color: var(--text-color);
}

.sidebar.close .toggle {
  transform: translateY(-50%) rotate(0deg);
}

.sidebar .menu {
  margin-top: 40px;
}

.sidebar li.search-box {
  border-radius: 6px;
  background-color: var(--primary-color-light);
  cursor: pointer;
  transition: var(--tran-05);
}

> Didi:
.sidebar li.search-box input {
  height: 100%;
  width: 100%;
  outline: none;
  border: none;
  background-color: var(--primary-color-light);
  color: var(--text-color);
  border-radius: 6px;
  font-size: 17px;
  font-weight: 500;
  transition: var(--tran-05);
}
.sidebar li a {
  list-style: none;
  height: 100%;
  background-color: transparent;
  display: flex;
  align-items: center;
  height: 100%;
  width: 100%;
  border-radius: 6px;
  text-decoration: none;
  transition: var(--tran-03);


}

.sidebar li a:hover {
  background-color: var(--primary-color);
}
.sidebar li a:hover .icon,
.sidebar li a:hover .text {
  color: var(--sidebar-color);
}
body.dark .sidebar li a:hover .icon,
body.dark .sidebar li a:hover .text {
  color: var(--text-color);
}

.sidebar .menu-bar {
  height: calc(100% - 55px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow-y: scroll;
}
.menu-bar::-webkit-scrollbar {
  display: none;
}
.sidebar .menu-bar .mode {
  border-radius: 6px;
  background-color: var(--primary-color-light);
  position: relative;
  transition: var(--tran-05);
}

.menu-bar .mode .sun-moon {
  height: 50px;
  width: 60px;
}

.mode .sun-moon i {
  position: absolute;
}
.mode .sun-moon i.sun {
  opacity: 0;
}
body.dark .mode .sun-moon i.sun {
  opacity: 1;
}
body.dark .mode .sun-moon i.moon {
  opacity: 0;
}

.menu-bar .bottom-content .toggle-switch {
  position: absolute;
  right: 0;
  height: 100%;
  min-width: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  cursor: pointer;
}
.toggle-switch .switch {
  position: relative;
  height: 22px;
  width: 40px;
  border-radius: 25px;
  background-color: var(--toggle-color);
  transition: var(--tran-05);
}

.switch::before {
  content: "";
  position: absolute;
  height: 15px;
  width: 15px;
  border-radius: 50%;
  top: 50%;
  left: 5px;
  transform: translateY(-50%);
  background-color: var(--sidebar-color);
  transition: var(--tran-04);
}

body.dark .switch::before {
  left: 20px;
}

.home {
  position: absolute;
  top: 0;
  top: 0;
  left: 250px;
  height: 100vh;
  width: calc(100% - 250px);
  background-color: var(--body-color);
  transition: var(--tran-05);
}
.home .text {
  font-size: 30px;
  font-weight: 500;
  color: var(--text-color);
  padding: 12px 60px;
}

.sidebar.close ~ .home {
  left: 78px;
  height: 100vh;
  width: calc(100% - 78px);
}
body.dark .home .text {
  color: var(--text-color);
}

/*form end css*/
/* Modal Dialog to control the overall size */
.modal-dialog {
    max-width: 950px; /* Decreased max-width for the modal */
    width: 80%; /* Modal takes up 80% of the screen width */
    margin: 0 auto; /* Center the modal horizontally */
}

/* Main form container inside modal */
.main {
    background-color: #fff;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    padding: 20px;
    width: 100%; /* Full width of the modal container */
    max-width: 1600px; /* Maximum width of the form */
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* Align content at the top */
    align-items: center;
}

/* Title of the form */
.main h2 {
    color: #4caf50;
    margin-bottom: 20px;
    text-align: center;
}

/* Label styling */
label {
    display: block;
    margin-bottom: 5px;
    color: #555;
    font-weight: bold;
}

/* Row for the text fields, two in a row */
.form-row {
    display: flex;
    justify-content: space-between;
    gap: 130px; /* Increased gap between the fields */
    margin-bottom: 6px;
    width: 100%; /* Ensure the row takes full width of the modal */
}

/* Adjust width of form fields */
.form-row > div {
    width: 45%; /* Reduced the width of each input field container */
    margin-right:50px;
}

/* Style for text fields, textarea, and file inputs */
input[type="text"],
textarea,

select {
    width: 140%; /* Full width of each input */
    padding: 15px; /* Increased padding for larger fields */
    padding-left: 10px; /* Decreased left padding */
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 18px; /* Larger font size */
    margin-bottom: 20px; /* Added margin to create space below the text fields */

}
input[type="file"],
select {
    width: 105%; /* Full width of each input */
    padding: 15px; /* Increased padding for larger fields */
    padding-left: 10px; /* Decreased left padding */
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 18px; /* Larger font size */
    margin-bottom: 20px; /* Added margin to create space below the text fields */
}


/* Special styling for the textarea */
textarea {
    height: 120px; /* Increased height for textarea */
    width: 140%; /* Ensures full width of the container */
    max-width: 140%; /* Make sure it doesn't exceed its container */
}

/* Button style */
button[type="submit"] {
    padding: 15px;
    border-radius: 10px;
    border: none;
    background-color: #4caf50;
    color: white;
    cursor: pointer;
    width: 105%; /* Full width button */
    font-size: 16px;
    margin-top: 20px;
}

/* Table styling */
table {
    width: 100%; /* Make the table take up the full width of the container */
    border-collapse: collapse;
    margin-top: 20px;
}

table th, table td {
    padding: 10px;
    text-align: left;
    border: 1px solid #ddd;
}

table th {
    background-color: #f4f4f4;
}


</style>
<body>
  <nav class="sidebar close">
    <header>
      <div class="image-text">
        <span class="image">
          <img src="logo.png" alt="">
        </span>

        <div class="text logo-text">
          <span class="name">MyDash</span>
          <span class="profession">Board</span>
        </div>
      </div>

      <i class='bx bx-chevron-right toggle'></i>
    </header>

    <div class="menu-bar">
      <div class="menu">
        <li class="search-box">
          <i class='bx bx-search icon'></i>
          <input type="text" placeholder="Search ...">
        </li>

        <ul class="menu-links">
          <li class="nav-link">
            <a href="javascript:void(0)" onclick="showPage('dashboard')">
              <i class='bx bx-home-alt icon'></i>
              <span class="text nav-text">Dashboard</span>
            </a>
          </li>

          <li class="nav-link">
            <a href="javascript:void(0)" onclick="showPage('hotelInfo')">
              <i class='bx bx-bar-chart-alt-2 icon'></i>
              <span class="text nav-text" data-bs-toggle="modal" data-bs-target="#exampleModal">Add Event</span>
            </a>
          </li>

          <li class="nav-link">
            <a href="http://127.0.0.1:8000/eventregister" onclick="showPage('notifications')">
              <i class='bx bx-bell icon'></i>
              <span class="text nav-text">Event Register</span>
            </a>
          </li>

          <li class="nav-link">
            <a href="javascript:void(0)" onclick="showPage('analytics')">
              <i class='bx bx-pie-chart-alt icon'></i>
              <span class="text nav-text">User Register</span>
            </a>
          </li>

          <li class="nav-link">
            <a href="javascript:void(0)" onclick="showPage('likes')">
              <i class='bx bx-heart icon'></i>
              <span class="text nav-text">Likes</span>
            </a>
          </li>

<li class="nav-link">
            <a href="javascript:void(0)" onclick="showPage('wallets')">
              <i class='bx bx-wallet icon'></i>
              <span class="text nav-text">Wallets</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="bottom-content">
        <li class="">
          <a href="#">
            <i class='bx bx-log-out icon'></i>
            <span class="text nav-text">Logout</span>
          </a>
        </li>
        <li class="mode">
          <div class="sun-moon">
            <i class='bx bx-moon icon moon'></i>
            <i class='bx bx-sun icon sun'></i>
          </div>
          <span class="mode-text text">Dark mode</span>

          <div class="toggle-switch">
            <span class="switch"></span>
          </div>
        </li>
      </div>
    </div>

  </nav>

  <section class="home">
    <!-- Content Sections -->
    <div id="dashboard" class="page-content">
      <div class="text">Dashboard</div>
    </div>



    <div id="notifications" class="page-content" style="display:none;">
      <div class="text">Notifications</div>
    </div>

    <div id="analytics" class="page-content" style="display:none;">
      <div class="text">Analytics</div>
    </div>

    <div id="likes" class="page-content" style="display:none;">
      <div class="text">Likes</div>
    </div>

    <div id="wallets" class="page-content" style="display:none;">
      <div class="text">Wallets</div>
    </div>
  </section>

<!-- form -->

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <div class="main">
          <h2>Registration Form</h2>
          <form method="post" action="addinfo" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-row">
              <div>
                <label>Event Name:</label>
                <input type="text" name="ename" required />
              </div>
              <div>
                <label>Event Type:</label>
                <input type="text" name="etype" required />
              </div>
            </div>

            <div class="form-row">
              <div>
                <label>Event Capacity:</label>
                <input type="text" name="capacity" required />
              </div>
              <div>
                <label>Event Location:</label>
                <input type="text" name="elocation" required />
              </div>
            </div>

            <div class="form-row">
              <div>
                <label>Event Price:</label>
                <input type="text" name="price" required />
              </div>
              <div>
                <label>Event Details:</label>
                <textarea name="edata"></textarea>
              </div>
            </div>

            <label>Event Image:</label>
            <input type="file" name="eimage" required /><br>

            <button type="submit">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- form end -->



  <script>
    const body = document.querySelector('body'),
      sidebar = body.querySelector('nav'),
      toggle = body.querySelector(".toggle"),
      searchBtn = body.querySelector(".search-box"),
      modeSwitch = body.querySelector(".toggle-switch"),
      modeText = body.querySelector(".mode-text");

    toggle.addEventListener("click", () => {
      sidebar.classList.toggle("close");
    });

    searchBtn.addEventListener("click", () => {
      sidebar.classList.remove("close");
    });

    modeSwitch.addEventListener("click", () => {
      body.classList.toggle("dark");
      if (body.classList.contains("dark")) {
        modeText.innerText = "Light mode";
      } else {
        modeText.innerText = "Dark mode";
      }
    });

    // Function to show different pages based on menu item clicked
    function showPage(pageId) {
      // Hide all pages
      const pages = document.querySelectorAll('.page-content');
      pages.forEach(page => {
        page.style.display = 'none';
      });

      // Show the selected page
      const selectedPage = document.getElementById(pageId);
      if (selectedPage) {
        selectedPage.style.display = 'block';
      }
    }
  </script>
</body>
