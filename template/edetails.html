<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet"> <!-- Google Fonts -->
    <style>
        /* Reset default margins/paddings for consistency */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(45deg, #f2f2f2, #e6e6e6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0 15px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 100%;
            height: 700px;
            display: flex;
            flex-direction: row;
            transition: all 0.3s ease-in-out;
            margin: 20px;
            transform: scale(1);
        }

        .card:hover {
            transform: scale(1.00);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .image {
            width: 50%;
            height: 100%;
            overflow: hidden;
            position: relative;
            border-radius: 16px 0 0 16px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(100%);
            transition: all 0.3s ease;
        }

        .image:hover img {
            filter: brightness(80%);
        }

        .details {
            padding: 30px;
            width: 70%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            background-color: #ffffff;
            border-radius: 0 16px 16px 0;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .details h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: #2095ae;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
        }

        .details p {
            font-size: 18px;
            color: black;
            margin-bottom: 12px;
            line-height: 1.8;
            transition: color 0.3s ease;
        }
        .details p strong{
            font-size: 20px;
        }

        .details p:hover {
            color: #000;
        }

        .details strong {
            color: #2095ae;
            font-weight: 700;
        }

        /* Button Style */
        .btn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #2095ae;
            color: #fff;
            border: none;
            border-radius: 25px;
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #2095ae;
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .card {
                flex-direction: column;
                height: auto;
            }

            .image {
                height: 250px;
            }

            .details h1 {
                font-size: 28px;
            }

            .details p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<form method="post" action="bookingform">
    {{uemail}}
    {% csrf_token %}
    <section id="main">
        <div class="container">
            <div class="card">
                <div class="image">
                    {% if data %}
                    <img src="{% static 'images/' %}{{ data.7 }}" alt="Product Image" class="img-fluid">
                    {% else %}
                    <p>No image available</p>
                    {% endif %}

                </div>
                <div class="details">
                    {% if data %}
                        <h1>{{ data.2 }}</h1>
                        <p><input type="hidden" name="eid" value="{{ mydata.0 }}"></p>
                        <p><strong>Details :</strong> {{ data.3 }}</p>
                        <p><strong>Capacity :</strong> {{ data.4 }}</p>
                        <p><strong>Location :</strong> {{ data.5 }}</p>
                        <p><strong>Price :</strong> {{ data.6 }}</p>
                    {% else %}
                        <p>No product details available.</p>
                    {% endif %}
              <input type="hidden" name="uemail" value="{{uemail}}">
              <input type="hidden" name="eid" value="{{ data.0 }}">
              <input type="hidden" name="price" value="{{ data.6 }}">

                    <input class="btn" type="submit" value=" Book Now">
<!--                    <button class="btn">Book Now</button>-->
                </div>
            </div>
        </div>
    </section>
</form>
</body>
</html>
